# ==============================================================================
#                      Moderatio Configuration File
#                     Purpur 1.21.6 / Paper Dialog API
# ==============================================================================
# Доступные плейсхолдеры для консольных команд наказаний:
#   {target}    — ник целевого игрока-нарушителя.
#   {duration}  — длительность наказания (например: 7d, 30d, 1h, perm).
#   {reason}    — причина наказания.
#   {moderator} — ник модератора, выдавшего наказание.
# ==============================================================================

# Список разработчиков проекта.
# Никам из этого списка эксклюзивно доступны:
# - Меню троллинга над нарушителями
# - Подменю "Аудит состава" и история действий модераторов
# - Получение алертов Anti-Abuse (слив наказаний модераторами)
developers:
  - "ItzMrazotyaLin"

# Система контроля подозрительной активности персонала (Anti-Abuse)
anti-abuse:
  # Лимит наказаний (баны/муты) за указанный интервал времени
  punishment-limit: 2
  # Временное окно проверки в секундах
  check-interval-seconds: 60
  # Блокировать ли модератору возможность выдавать дальнейшие наказания при исчерпании лимита
  block-punishments-on-limit: true

# Общие настройки Staff Mode
settings:
  # Скорость полёта модератора (по умолчанию 0.1)
  fly-speed: 0.1
  # Сохранять ли режим Staff при смене миров (Multiverse persistence)
  persist-across-worlds: true

# Модуль Vanish (Скрытие модератора)
vanish:
  # Режимы скрытия:
  # 'INTERNAL' - встроенное скрытие через Bukkit API (hidePlayer, тишина звуков, скрытие из таба)
  # 'EXTERNAL' - вызов внешней команды стороннего плагина (например PremiumVanish, SuperVanish)
  mode: "INTERNAL"
  external-command: "vanish {moderator}"

# Маршрутизация исполнения наказаний (/ban vs /tempban, /mute vs /tempmute)
punishments:
  mode: "CONSOLE_COMMAND" # 'CONSOLE_COMMAND' или 'NATIVE' (для банов через Paper/Purpur API)
  use-separate-temp-commands: true # true: использовать temp-команды для временных сроков
  bans:
    perm-command: "ban {target} {reason}"
    temp-command: "tempban {target} {duration} {reason}"
    single-command: "ban {target} {duration} {reason}"
  mutes:
    perm-command: "mute {target} {reason}"
    temp-command: "tempmute {target} {duration} {reason}"
    single-command: "mute {target} {duration} {reason}"

# Готовые шаблоны блокировок (отображаются в Dialog API)
ban-templates:
  cheats:
    title: "<red>Читы"
    duration: "30d"
    reason: "Использование читов / запрещённого ПО"
  insult_family:
    title: "<yellow>Оскорбление родных"
    duration: "7d"
    reason: "Упоминание/оскорбление родственников"
  griefing:
    title: "<gold>Гриферство"
    duration: "14d"
    reason: "Гриферство и умышленная порча чужого имущества"
  rule_violation:
    title: "<red>Грубое нарушение"
    duration: "3d"
    reason: "Грубое нарушение правил сервера"
  adverts:
    title: "<dark_red>Реклама"
    duration: "perm"
    reason: "Реклама сторонних ресурсов и проектов"

# Готовые шаблоны мутов (блокировки чата)
mute-templates:
  flood:
    title: "<yellow>Флуд / Спам"
    duration: "1h"
    reason: "Флуд и спам в общем чате"
  caps:
    title: "<gold>Капс"
    duration: "30m"
    reason: "Злоупотребление верхним регистром"
  toxic:
    title: "<red>Оскорбления"
    duration: "2h"
    reason: "Оскорбление игроков и провокации"
  ad:
    title: "<dark_red>Реклама в чате"
    duration: "1d"
    reason: "Реклама сторонних ресурсов"

# Настройки оформления диалогов Dialog API
dialog:
  # Ширина кнопок (в пикселях интерфейса)
  button-width: 220
