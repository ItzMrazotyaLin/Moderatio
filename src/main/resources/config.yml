# ==============================================================================
#                      Moderatio Configuration File
#                     Purpur 1.21.6 / Paper Dialog API
#                 Встроенный собственный бэкенд наказаний
# ==============================================================================

# Список разработчиков проекта.
# Никам из этого списка эксклюзивно доступны:
# - Меню троллинга над нарушителями
# - Подменю "Аудит состава" и история действий модераторов
# - Получение алертов Anti-Abuse (слив наказаний модераторами)
developers:
  - "itzmr"

# Система контроля подозрительной активности персонала (Anti-Abuse)
anti-abuse:
  # Лимит наказаний (баны/муты/варны) за указанный интервал времени
  punishment-limit: 2
  # Временное окно проверки в секундах
  check-interval-seconds: 60
  # Блокировать ли модератору возможность выдавать дальнейшие наказания при исчерпании лимита
  block-punishments-on-limit: true

# Общие настройки Staff Mode
settings:
  # Скорость полёта модератора (по умолчанию 0.1)
  fly-speed: 0.1
  # Сохранять ли режим Staff при смене миров (Multiverse persistence)
  persist-across-worlds: true

# Модуль Vanish (Скрытие модератора)
vanish:
  # Режимы скрытия:
  # 'INTERNAL' - встроенное скрытие через Bukkit API (hidePlayer, тишина звуков, скрытие из таба)
  # 'EXTERNAL' - вызов внешней команды стороннего плагина (например PremiumVanish, SuperVanish)
  mode: "INTERNAL"
  external-command: "vanish {moderator}"

# Интеграция с внешними плагинами проверки на читы
cheat-check:
  enabled: true
  # Режим исполнения команды: MODERATOR (от лица модератора) или CONSOLE (от консоли)
  executor: "MODERATOR"
  # Команда начала проверки
  start-command: "check {target}"
  # Команда завершения/снятия с проверки
  finish-command: "uncheck {target}"
  # Автоматически переводить меню и модератора в режим проверки при вводе команды вручную в чат
  auto-detect-chat-command: false
  # Префикс команды для отслеживания в чате (без слеша)
  trigger-command: "check"
  # Префикс команды для отслеживания снятия с проверки в чате (без слеша)
  finish-trigger-command: "uncheck"

# Система предупреждений (варнов) и автоматических санкций
warns:
  expire-duration: "1d"
  # Режим работы при достижении лимита:
  # NOTIFICATION - модераторам отправляется уведомление, ручная выдача (ПО УМОЛЧАНИЮ)
  # PUNISHMENT - система сама автоматически выдает бан/мут
  mode: "NOTIFICATION"
  limits:
    chat:
      max: 3
      punish-duration: "12h"
    game:
      max: 3
      punish-duration: "1d"
  reset-warns-on-action: true

# Готовые шаблоны блокировок (отображаются в Dialog API)
ban-templates:
  cheats:
    title: "<red>Читы"
    duration: "30d"
    reason: "Использование читов / запрещённого ПО"
  insult_family:
    title: "<yellow>Оскорбление родных"
    duration: "7d"
    reason: "Упоминание/оскорбление родственников"
  griefing:
    title: "<gold>Гриферство"
    duration: "14d"
    reason: "Гриферство и умышленная порча чужого имущества"
  rule_violation:
    title: "<red>Грубое нарушение"
    duration: "3d"
    reason: "Грубое нарушение правил сервера"
  adverts:
    title: "<dark_red>Реклама"
    duration: "perm"
    reason: "Реклама сторонних ресурсов и проектов"

# Готовые шаблоны мутов (блокировки чата)
mute-templates:
  flood:
    title: "<yellow>Флуд / Спам"
    duration: "1h"
    reason: "Флуд и спам в общем чате"
  caps:
    title: "<gold>Капс"
    duration: "30m"
    reason: "Злоупотребление верхним регистром"
  toxic:
    title: "<red>Оскорбления"
    duration: "2h"
    reason: "Оскорбление игроков и провокации"
  ad:
    title: "<dark_red>Реклама в чате"
    duration: "1d"
    reason: "Реклама сторонних ресурсов"

# Готовые шаблоны варнов (предупреждений)
warn-templates:
  chat:
    title: "<yellow>Нарушение правил чата (CHAT)"
    category: "CHAT"
    reason: "Нарушение правил общения в чате"
  trolling:
    title: "<gold>Помеха игрокам (GAME)"
    category: "GAME"
    reason: "Создание помех и токсичное поведение в игре"
  suspicious:
    title: "<red>Подозрительное поведение (GAME)"
    category: "GAME"
    reason: "Подозрительное поведение / отказ от проверки"

# Настройки оформления диалогов Dialog API
dialog:
  # Ширина кнопок (в пикселях интерфейса)
  button-width: 220
